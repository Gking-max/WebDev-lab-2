<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Belize | Photos</title>
  <!--
    Stylesheets are loaded in this order on purpose:
    1. reset.css removes inconsistent browser defaults.
    2. main.css adds the design for this specific page.
  -->
  <link rel="stylesheet" href="reset.css"> 
  <link rel="stylesheet" href="main.css">  
</head>
<body>
  <main>
    <h1>The Jewel of Central America</h1>

   <section class="gallery-section" aria-labelledby="gallery-title">
    <h2 id="gallery-title">Wildlife and landmarks of Belize</h2>
    <div class="gallery">
        <figure>
            <img src="images/antillean-manatee.png" alt="An Antillean manatee in Belize">
            <figcaption>Antillean manatee</figcaption>
        </figure>
        <figure>
            <img src="images/bairds-tapir.png" alt="A Baird's tapir in Belize">
            <figcaption>Baird's tapir</figcaption>
        </figure>
        <figure>
            <img src="images/black-orchid.png" alt="A black orchid in Belize">
            <figcaption>Black orchid</figcaption>
        </figure>
        <figure>
            <img src="images/blue-hole.png" alt="The Great Blue Hole in Belize">
            <figcaption>The Great Blue Hole</figcaption>
        </figure>
        <figure>
            <img src="images/green-iguana.png" alt="A green iguana in Belize">
            <figcaption>Green iguana</figcaption>
        </figure>
    </div>
</section>
  </main>
</body>
</html>
